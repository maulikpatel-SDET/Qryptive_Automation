name: Playwright Tests

# Title shown in the Actions list, e.g. "main | qa | by maulik"
# (the branch is picked in the "Use workflow from" dropdown of the Run workflow form)
run-name: ${{ format('{0} | {1} | by {2}', github.head_ref || github.ref_name, inputs.environment || 'qa', github.actor) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Manual run: Actions tab > Playwright Tests > "Run workflow"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run the tests on'
        type: choice
        options: [qa, staging, production]
        default: qa

# Only one run at a time - all runs share the same mailbox / login account
concurrency:
  group: playwright-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # PostgreSQL for test results (fresh for every run).
    # If you add DB_HOST etc. as secrets, your own database is used instead.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: Qryptive
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Same values as the local .env file. Secrets come from
    # GitHub > Settings > Secrets and variables > Actions.
    env:
      ENV: ${{ inputs.environment || 'qa' }}
      HEADLESS: 'true'
      CI: 'true'

      # Login + mailbox
      LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
      MAIL_HOST: ${{ vars.MAIL_HOST || 'imap.gmail.com' }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAGIC_LINK: ''

      # Report email
      REPORT_TO: ${{ secrets.REPORT_TO }}
      SEND_REPORT_EMAIL: 'true'

      # PostgreSQL (defaults = the service container above)
      DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
      DB_PORT: ${{ secrets.DB_PORT || '5432' }}
      DB_NAME: ${{ secrets.DB_NAME || 'Qryptive' }}
      DB_USER: ${{ secrets.DB_USER || 'postgres' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'postgres' }}
      SAVE_RESULTS_TO_DB: 'true'

      # Project + artifacts
      PROJECT_KEY: QRYPTIVE
      PROJECT_NAME: Qryptive
      ARTIFACT_DIR: artifacts
      DB_POOL_MAX: '10'
      RETRIES: '0'

    steps:
      - name: Show run settings
        run: |
          echo "### Test run settings" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${{ github.head_ref || github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${GITHUB_SHA::7} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Started by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | $ENV |" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome

      # Locally auth/session-<env>.json already exists. On GitHub it does not,
      # so log in once first to create it - otherwise the dashboard tests are skipped.
      # Only the "list" reporter here: no DB row, no email, no HTML report.
      - name: Create login session (TC01)
        run: npx playwright test --grep "@magic" --reporter=list

      # All tests, except TC14 which fails on purpose
      - name: Run all tests
        run: npx playwright test --grep-invert "@faildemo"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.ENV }}-${{ github.run_number }}
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshots, videos, traces and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ env.ENV }}-${{ github.run_number }}
          path: |
            screenshots/
            artifacts/
            logs/
          retention-days: 14
          if-no-files-found: ignore
